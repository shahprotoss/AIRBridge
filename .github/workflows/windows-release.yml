name: Build Windows and release AIRBridge

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify server transfers
        run: python -m unittest -v test_transfer test_localization

      - name: Verify iPhone language selection
        run: node test_i18n.js

      - name: Generate app icon
        run: python make_icon.py

      - name: Build Windows executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name AIRBridge
          --icon "assets\airbridge.ico"
          --add-data "web;web"
          --add-data "assets;assets"
          --collect-all customtkinter
          --collect-all qrcode
          --hidden-import PIL._tkinter_finder
          --hidden-import winotify
          app.py

      - name: Create ZIP for users
        run: python package_airbridge.py

      - name: Upload ZIP and executable to build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIRBridge-Windows
          path: |
            AIRBridge-v*-Pakej-Lengkap.zip
            dist/AIRBridge.exe
            INFOGRAFIK-CARA-GUNA-AIRBRIDGE.png

      - name: Publish Release on tagged commits
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $package = (Get-ChildItem -File -Filter "AIRBridge-v*-Pakej-Lengkap.zip" |
            Select-Object -First 1).FullName
          if (-not $package) { throw "AIRBridge ZIP was not generated" }
          gh release create "$env:GITHUB_REF_NAME" `
            "$package" `
            "dist/AIRBridge.exe" `
            "INFOGRAFIK-CARA-GUNA-AIRBRIDGE.png" `
            --title "AIRBridge $env:GITHUB_REF_NAME" `
            --notes-file "RELEASE_NOTES.md" `
            --latest
